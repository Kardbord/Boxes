<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --code-bg: #1c2128;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
  h1, h2, h3, h4 { font-weight: 600; line-height: 1.25; }
  h1 { font-size: 2rem; margin: 0 0 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
  h2 { font-size: 1.5rem; margin: 2.5rem 0 1rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.2rem; margin: 2rem 0 0.75rem; }
  h4 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
  p { margin: 0.5rem 0 1rem; }
  ul, ol { margin: 0.5rem 0 1rem 1.5rem; }
  li { margin: 0.25rem 0; }
  li > ul, li > ol { margin-top: 0.25rem; margin-bottom: 0.25rem; }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    overflow-x: auto;
    font-size: 0.85rem;
    line-height: 1.5;
    margin: 0.75rem 0 1rem;
  }
  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.9em;
  }
  :not(pre) > code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.15em 0.4em;
  }
  pre > code {
    background: none;
    border: none;
    padding: 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.9rem;
  }
  th, td {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
  }
  th {
    background: var(--surface);
    font-weight: 600;
  }
  tr:nth-child(even) { background: var(--surface); }
  blockquote {
    border-left: 3px solid var(--accent);
    margin: 1rem 0;
    padding: 0.5rem 1rem;
    color: var(--muted);
    background: var(--surface);
    border-radius: 0 6px 6px 0;
  }
  blockquote p { margin: 0.25rem 0; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  img { max-width: 100%; }
  details { margin: 1rem 0; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  summary:hover { text-decoration: underline; }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { margin: 0 0.75rem; }
</style>
</head>
<body>
<div class="container">

$body$

<footer>
  <a href="https://github.com/Kardbord/Boxes">GitHub</a>
  <a href="https://build.opensuse.org/project/show/home:Kardbord:Boxes">OBS Project</a>
  <a href="https://download.opensuse.org/repositories/home:/Kardbord:/Boxes/">RPM/DEB Packages</a>
  <a href="https://github.com/Kardbord/Boxes/blob/main/ARCHITECTURE.md">Architecture</a>
  <a href="https://github.com/Kardbord/Boxes/blob/main/flatpak/README.md">Flatpak Docs</a>
</footer>

</div>
</body>
</html>
