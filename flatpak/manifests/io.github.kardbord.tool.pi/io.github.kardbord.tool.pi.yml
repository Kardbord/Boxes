# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json
id: io.github.kardbord.tool.pi
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
modules:
  - name: pi
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/bin
      - cp -a ./* ${FLATPAK_DEST}/bin
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/earendil-works/pi/releases/download/v1.6.0/pi-linux-x64.tar.gz
        sha256: ef77dbe4379b3bdeb425a1e1b862fa3c915c255000dfe4965c98eee96a5765d1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/earendil-works/pi/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("pi-linux-x64\\.tar\\.gz$")) | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/earendil-works/pi/releases/download/v1.6.0/pi-linux-arm64.tar.gz
        sha256: 5404547b9739be596d50ae7142c52535899e8e7dd37a7bace9be593e0355b468
        x-checker-data:
          type: json
          url: https://api.github.com/repos/earendil-works/pi/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("pi-linux-arm64\\.tar\\.gz$")) | .browser_download_url
