# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.actionlint
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: actionlint
    buildsystem: simple
    build-commands:
      - install -Dm755 actionlint ${FLATPAK_DEST}/bin/actionlint
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rhysd/actionlint/releases/latest
          version-query: '.tag_name | sub("^v"; "")'
          url-query: '.assets[] | select(.name | test("linux_amd64\\.tar\\.gz$")) | .browser_download_url'
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz
        sha256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/rhysd/actionlint/releases/latest
          version-query: '.tag_name | sub("^v"; "")'
          url-query: '.assets[] | select(.name | test("linux_arm64\\.tar\\.gz$")) | .browser_download_url'
