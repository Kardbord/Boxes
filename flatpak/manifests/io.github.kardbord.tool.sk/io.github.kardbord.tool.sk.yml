# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.sk
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: sk
    buildsystem: simple
    build-commands:
      - install -Dm755 sk ${FLATPAK_DEST}/bin/sk
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/skim-rs/skim/releases/download/v5.7.2/skim-x86_64-unknown-linux-musl.tar.xz
        sha256: 1524e895389cde451dcc3c0f6c5d97508a7bdb12a3fb34887bda8992eda170fd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/skim-rs/skim/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("x86_64-unknown-linux-musl\\.tar\\.xz$"))
            | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/skim-rs/skim/releases/download/v5.7.2/skim-aarch64-unknown-linux-musl.tar.xz
        sha256: 7aa800a55630cc8bd5c922e32dc041646bef758f78123b8496d497ee3173bc54
        x-checker-data:
          type: json
          url: https://api.github.com/repos/skim-rs/skim/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("aarch64-unknown-linux-musl\\.tar\\.xz$"))
            | .browser_download_url
