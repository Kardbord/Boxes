# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.sk
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: sk
    buildsystem: simple
    build-commands:
      - install -Dm755 sk ${FLATPAK_DEST}/bin/sk
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/skim-rs/skim/releases/download/v5.7.4/skim-x86_64-unknown-linux-musl.tar.xz
        sha256: 6cf33d76fcfe467b99fe0250d0337fb98c527f1a929a3e1eed870bc9fcc4aea8
        x-checker-data:
          type: json
          url: https://api.github.com/repos/skim-rs/skim/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("x86_64-unknown-linux-musl\\.tar\\.xz$"))
            | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/skim-rs/skim/releases/download/v5.7.4/skim-aarch64-unknown-linux-musl.tar.xz
        sha256: 736a1ee6b574a30b755c03de23664816ac9fbca8b947c80588abfdb847dc8ffe
        x-checker-data:
          type: json
          url: https://api.github.com/repos/skim-rs/skim/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("aarch64-unknown-linux-musl\\.tar\\.xz$"))
            | .browser_download_url
