# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.ruby4
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: ruby4
    buildsystem: simple
    build-commands:
      - ./configure --prefix=${FLATPAK_DEST}
      - make  -j ${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: archive
        url: https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.7.tar.gz
        sha256: 911ace20f90d068ca0e4dda6d0e4f0f81e52e52f2dd4f4004c721e253412e82d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ruby/ruby/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://cache.ruby-lang.org/pub/ruby/4.0/ruby-\(.tag_name |
            sub("^v"; "")).tar.gz"'
