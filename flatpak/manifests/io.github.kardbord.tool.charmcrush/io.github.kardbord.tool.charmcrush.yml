# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json
id: io.github.kardbord.tool.charmcrush
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
modules:
  - name: charmcrush
    buildsystem: simple
    build-commands:
      - install -Dm755 crush ${FLATPAK_DEST}/bin/charmcrush
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/charmbracelet/crush/releases/download/v0.99.0/crush_0.99.0_Linux_x86_64.tar.gz
        sha256: ec20f001028dfb7b6427225f0cf5215081275c8f09f45001a8535847cc4fd6ea
        x-checker-data:
          type: json
          url: https://api.github.com/repos/charmbracelet/crush/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("Linux_x86_64\\.tar\\.gz$")) | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/charmbracelet/crush/releases/download/v0.99.0/crush_0.99.0_Linux_arm64.tar.gz
        sha256: 83ba6e739ad3768b480ee3df0d28cb58b7ca9bde5c9384a8b203224aaa5a27cb
        x-checker-data:
          type: json
          url: https://api.github.com/repos/charmbracelet/crush/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("Linux_arm64\\.tar\\.gz$")) | .browser_download_url
