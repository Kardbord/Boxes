# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json
id: io.github.kardbord.tool.charmcrush
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
modules:
  - name: charmcrush
    buildsystem: simple
    build-commands:
      - install -Dm755 crush ${FLATPAK_DEST}/bin/charmcrush
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/charmbracelet/crush/releases/download/v0.100.0/crush_0.100.0_Linux_x86_64.tar.gz
        sha256: 122d4afe0e3bb0fc4c571f58b0c08d485c8733f272e962a02064c2150cd7a152
        x-checker-data:
          type: json
          url: https://api.github.com/repos/charmbracelet/crush/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("Linux_x86_64\\.tar\\.gz$")) | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/charmbracelet/crush/releases/download/v0.100.0/crush_0.100.0_Linux_arm64.tar.gz
        sha256: 095e3ab19710508e9ae41919e5f179f69bac390aeb7c06a14ef999c78dde705a
        x-checker-data:
          type: json
          url: https://api.github.com/repos/charmbracelet/crush/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("Linux_arm64\\.tar\\.gz$")) | .browser_download_url
