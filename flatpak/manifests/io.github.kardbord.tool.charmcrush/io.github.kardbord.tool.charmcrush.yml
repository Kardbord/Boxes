# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json
id: io.github.kardbord.tool.charmcrush
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
modules:
  - name: charmcrush
    buildsystem: simple
    build-commands:
      - install -Dm755 crush ${FLATPAK_DEST}/bin/charmcrush
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/charmbracelet/crush/releases/download/v0.101.0/crush_0.101.0_Linux_x86_64.tar.gz
        sha256: cf234948e3d7c5236d18a048a38f25a7df9ca24ba0b8fdaa525d45c5f705f99a
        x-checker-data:
          type: json
          url: https://api.github.com/repos/charmbracelet/crush/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("Linux_x86_64\\.tar\\.gz$")) | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/charmbracelet/crush/releases/download/v0.101.0/crush_0.101.0_Linux_arm64.tar.gz
        sha256: ebbc141e80ad19d321b89558c2513fac5bebabd97530570ce749902dc4411f05
        x-checker-data:
          type: json
          url: https://api.github.com/repos/charmbracelet/crush/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("Linux_arm64\\.tar\\.gz$")) | .browser_download_url
