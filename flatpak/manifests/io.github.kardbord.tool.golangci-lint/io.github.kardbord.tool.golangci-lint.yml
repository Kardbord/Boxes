# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json
id: io.github.kardbord.tool.golangci-lint
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
modules:
  - name: golangci-lint
    buildsystem: simple
    build-commands:
      - install -Dm755 golangci-lint ${FLATPAK_DEST}/bin/golangci-lint
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz
        sha256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        x-checker-data:
          type: json
          url: https://api.github.com/repos/golangci/golangci-lint/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("-linux-amd64\\.tar\\.gz$"))
            | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-arm64.tar.gz
        sha256: b4d8f17068b35ee6060cc2f69a16fb48740d706fbba81661c318649c114a6998
        x-checker-data:
          type: json
          url: https://api.github.com/repos/golangci/golangci-lint/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("-linux-arm64\\.tar\\.gz$"))
            | .browser_download_url
