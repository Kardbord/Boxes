# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.ripgrep
default-branch: stable
runtime: io.github.kardbord.Platform
runtime-version: 'stable'
sdk: io.github.kardbord.Sdk
command: rg-wrapper

add-extensions:
  io.github.kardbord.tool.ripgrep:
    directory: lib/kardbord-tools/ripgrep
    version: stable
    no-autodownload: false

modules:
  - name: ripgrep
    buildsystem: simple
    build-commands:
      - install -Dm755 rg-wrapper /app/bin/rg-wrapper
    sources:
      - type: file
        path: rg-wrapper

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/kardbord-tools/ripgrep
