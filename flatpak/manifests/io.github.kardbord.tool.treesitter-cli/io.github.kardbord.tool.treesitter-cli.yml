# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.treesitter-cli
default-branch: stable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false

modules:
  - name: treesitter-cli
    buildsystem: simple
    build-commands:
      - unzip *.zip
      - install -Dm755 tree-sitter ${FLATPAK_DEST}/bin/tree-sitter
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.13/tree-sitter-cli-linux-x64.zip
        sha256: 1b781c0dc1dfefea44b5db2ec2a58440fe9d006856c3f5b3fd9a17119d1138a2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tree-sitter/tree-sitter/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux-x64\\.zip$")) | .browser_download_url
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.13/tree-sitter-cli-linux-arm64.zip
        sha256: 72c6d6c669c70491f93db290b285d9e85fd68ead9e324cc55ace35a1be66c3bd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tree-sitter/tree-sitter/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux-arm64\\.zip$")) | .browser_download_url
