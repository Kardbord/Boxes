# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.treesitter-cli
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: treesitter-cli
    buildsystem: simple
    build-commands:
      - unzip *.zip
      - install -Dm755 tree-sitter ${FLATPAK_DEST}/bin/tree-sitter
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.2/tree-sitter-cli-linux-x64.zip
        sha256: b4233ecc4f0e648d6d8ccc4bac96c00c712ca1a5eb1e0ca7197d29b750bffa6d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tree-sitter/tree-sitter/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux-x64\\.zip$")) | .browser_download_url
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.2/tree-sitter-cli-linux-arm64.zip
        sha256: 4598875d129dfef384b3d78da329b766f151c2f827404fb5f3363a135935d0d3
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tree-sitter/tree-sitter/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux-arm64\\.zip$")) | .browser_download_url
