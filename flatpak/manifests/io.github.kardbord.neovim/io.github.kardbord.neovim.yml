# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.neovim
default-branch: stable
runtime: io.github.kardbord.Sdk
runtime-version: stable
sdk: io.github.kardbord.Sdk
base: io.neovim.nvim
command: nvim-wrapper-wrapper

modules:
  - name: neovim-wrapper-wrapper
    buildsystem: simple
    build-commands:
      - install -Dm755 nvim-wrapper-wrapper /app/bin/nvim-wrapper-wrapper
    sources:
      - type: file
        path: nvim-wrapper-wrapper
      # Dummy source for FEDC to check for updates to the upstream manifest
      - type: file
        url: https://raw.githubusercontent.com/flathub/io.neovim.nvim/d8885a32103ace96c88639c90fe94e13c55fa820/io.neovim.nvim.yaml
        sha256: 1b265adf191f6b23c8ba48f669e37cca2ea90bae84eef7a7142c3fe8de7dc087
        x-checker-data:
          type: json
          url: https://api.github.com/repos/flathub/io.neovim.nvim/commits?per_page=1
          version-query: .[0].sha[:7]
          url-query: '"https://raw.githubusercontent.com/flathub/io.neovim.nvim/"
            + .[0].sha + "/io.neovim.nvim.yaml"'
          timestamp-query: .[0].commit.author.date

finish-args:
  - --filesystem=/tmp
  - --filesystem=/var/tmp
  - --filesystem=xdg-config/nvim
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
