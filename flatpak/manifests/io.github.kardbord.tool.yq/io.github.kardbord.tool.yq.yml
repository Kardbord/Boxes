# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.yq
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: yq
    buildsystem: simple
    build-commands:
      - install -Dm755 yq_* ${FLATPAK_DEST}/bin/yq
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64.tar.gz
        sha256: 09a25baa0e136b8633949e03117fc82cb9e50d10910f988ef17a1305539ebce4
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mikefarah/yq/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("yq_linux_amd64\\.tar\\.gz$"))
            | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_arm64.tar.gz
        sha256: 980de87c439acb5172707560dd137e9fe4a1628af5aaf6f33b293f04c71d4e9d
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mikefarah/yq/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("yq_linux_arm64\\.tar\\.gz$"))
            | .browser_download_url
