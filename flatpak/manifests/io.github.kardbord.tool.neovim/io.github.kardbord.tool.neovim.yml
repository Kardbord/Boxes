# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.neovim
default-branch: stable
build-extension: true
separate-locales: false
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08

modules:
  - name: neovim
    buildsystem: simple
    build-commands:
      - cp -a ./* ${FLATPAK_DEST}/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
        sha256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
        x-checker-data:
          type: json
          url: https://api.github.com/repos/neovim/neovim/releases/latest
          version-query: '.tag_name | sub("^v"; "")'
          url-query: '.assets[] | select(.name | test("linux-x86_64\\.tar\\.gz$")) | .browser_download_url'
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-arm64.tar.gz
        sha256: 1aa5ca085249580ae0f91eb14f27ec0919773ff2d99a163d03f3d6c21ac29725
        x-checker-data:
          type: json
          url: https://api.github.com/repos/neovim/neovim/releases/latest
          version-query: '.tag_name | sub("^v"; "")'
          url-query: '.assets[] | select(.name | test("linux-arm64\\.tar\\.gz$")) | .browser_download_url'
