# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.neovim
default-branch: stable
build-extension: true
separate-locales: false
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08

modules:
  - name: neovim
    buildsystem: simple
    build-commands:
      - cp -a ./* ${FLATPAK_DEST}/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz
        sha256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
        x-checker-data:
          type: json
          url: https://api.github.com/repos/neovim/neovim/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux-x86_64\\.tar\\.gz$"))
            | .browser_download_url
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-arm64.tar.gz
        sha256: 8f1f64a0bdb97247034038c3823c6cbad5bdf9ecd5751b85494b71c3ee04c815
        x-checker-data:
          type: json
          url: https://api.github.com/repos/neovim/neovim/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux-arm64\\.tar\\.gz$")) |
            .browser_download_url
