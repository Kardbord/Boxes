# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.lua
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: lua
    buildsystem: simple
    build-commands:
      - make INSTALL_TOP=${FLATPAK_DEST} all install
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.5.1.tar.gz
        sha256: 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
        x-checker-data:
          type: html
          url: https://www.lua.org/ftp/
          version-pattern: 'lua-([0-9.]+)\.tar\.gz'
          url-template: https://www.lua.org/ftp/lua-$version.tar.gz

  - name: luarocks
    buildsystem: simple
    build-commands:
      - ./configure --with-lua-bin=${FLATPAK_DEST}/bin --prefix=${FLATPAK_DEST}
      - make
      - make install
    sources:
      - type: archive
        url: https://github.com/luarocks/luarocks/archive/refs/tags/v3.13.0.tar.gz
        sha256: 71adfead6966e2912034b8fb8103dd343c3adc6c91a276f1d209eebbaefe3a15
        x-checker-data:
          type: json
          url: https://api.github.com/repos/luarocks/luarocks/releases/latest
          version-query: '.tag_name | sub("^v"; "")'
          url-query: '"https://github.com/luarocks/luarocks/archive/refs/tags/\(.tag_name).tar.gz"'
