# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.opencode
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: opencode
    buildsystem: simple
    build-commands:
      - install -Dm755 opencode ${FLATPAK_DEST}/bin/opencode
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: 
          https://github.com/anomalyco/opencode/releases/download/v1.19.5/opencode-linux-x64.tar.gz
        sha256: 588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/anomalyco/opencode/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux-x64\\.tar\\.gz$")) | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: 
          https://github.com/anomalyco/opencode/releases/download/v1.19.5/opencode-linux-arm64.tar.gz
        sha256: fae5be262d693b7c5e562856cc473e59e741772936db0c0600ac0d5ed5bd088b
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/anomalyco/opencode/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux-arm64\\.tar\\.gz$")) |
            .browser_download_url
