# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json
id: io.github.kardbord.tool.omp
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
modules:
  - name: omp
    buildsystem: simple
    build-commands:
      - install -Dm755 omp* ${FLATPAK_DEST}/bin/omp
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/can1357/oh-my-pi/releases/download/v18.21.0/omp-linux-x64
        sha256: b00bd7ecdf7ad24d103ea56850969c9a8cc050527e1b9db64c25bbbf13fbedcc
        x-checker-data:
          type: json
          url: https://api.github.com/repos/can1357/oh-my-pi/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("omp-linux-x64$")) | .browser_download_url
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/can1357/oh-my-pi/releases/download/v18.21.0/omp-linux-arm64
        sha256: 3a3f3f1af115100670d555624a64069f32a0cc8c7ff43d721fa0ddef6c83b312
        x-checker-data:
          type: json
          url: https://api.github.com/repos/can1357/oh-my-pi/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("omp-linux-arm64$")) | .browser_download_url
