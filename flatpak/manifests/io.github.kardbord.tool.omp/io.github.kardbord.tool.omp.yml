# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json
id: io.github.kardbord.tool.omp
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
modules:
  - name: omp
    buildsystem: simple
    build-commands:
      - install -Dm755 omp* ${FLATPAK_DEST}/bin/omp
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/can1357/oh-my-pi/releases/download/v18.18.3/omp-linux-x64
        sha256: 8c9a178fed74ec1da21aafb7d28cd9839b3b0c9e7d607c86cc3b6177355729f4
        x-checker-data:
          type: json
          url: https://api.github.com/repos/can1357/oh-my-pi/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("omp-linux-x64$")) | .browser_download_url
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/can1357/oh-my-pi/releases/download/v18.18.3/omp-linux-arm64
        sha256: c49a84875d915c7d0de8bb69fe180b3bf53c16600bc4d5a61ea22ac2b3ac45c9
        x-checker-data:
          type: json
          url: https://api.github.com/repos/can1357/oh-my-pi/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("omp-linux-arm64$")) | .browser_download_url
