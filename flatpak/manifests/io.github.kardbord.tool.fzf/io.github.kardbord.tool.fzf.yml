# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.fzf
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: fzf
    buildsystem: simple
    build-commands:
      - install -Dm755 fzf ${FLATPAK_DEST}/bin/fzf
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-linux_amd64.tar.gz
        sha256: 05e6813a337cc722c3ed07e54a764b75cc5d671e2e60459db0ba696ee5fa7504
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/junegunn/fzf/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux_amd64\\.tar\\.gz$")) |
            .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-linux_arm64.tar.gz
        sha256: 5d673b849f494f0d64ec471d8640b153ca8849e3846a31da17abdcfce8df6b46
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/junegunn/fzf/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux_arm64\\.tar\\.gz$")) |
            .browser_download_url
