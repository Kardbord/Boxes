# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.fzf
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: fzf
    buildsystem: simple
    build-commands:
      - install -Dm755 fzf ${FLATPAK_DEST}/bin/fzf
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/junegunn/fzf/releases/download/v0.75.0/fzf-0.75.0-linux_amd64.tar.gz
        sha256: 0d6640f83582d991cf429754baad64b07e3a4e439a6019670f4b91da1314141c
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/junegunn/fzf/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux_amd64\\.tar\\.gz$")) |
            .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/junegunn/fzf/releases/download/v0.75.0/fzf-0.75.0-linux_arm64.tar.gz
        sha256: bd0717badb6a5620387e014bb94209aac4d9eab6ab77b5348eabb0833aeb4d59
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/junegunn/fzf/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("linux_arm64\\.tar\\.gz$")) |
            .browser_download_url
