# yaml-language-server: $schema=https://www.schemastore.org/flatpak-manifest.json

id: io.github.kardbord.tool.fd
default-branch: stable
runtime: io.github.kardbord.dev
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false

modules:
  - name: fd
    buildsystem: simple
    build-commands:
      - install -Dm755 fd ${FLATPAK_DEST}/bin/fd
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/sharkdp/fd/releases/download/v10.5.2/fd-v10.5.2-x86_64-unknown-linux-musl.tar.gz
        sha256: 7e2d07fa2b8807642aaec67b7e2972a9fbe4db26fcb340a7372392db42b26694
        x-checker-data:
          type: json
          url: https://api.github.com/repos/sharkdp/fd/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("x86_64-unknown-linux-musl\\.tar\\.gz$"))
            | .browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/sharkdp/fd/releases/download/v10.5.2/fd-v10.5.2-aarch64-unknown-linux-musl.tar.gz
        sha256: 63ea52cb31586e6d98efa2f06d73d542f16c7d0c4af0f07b579aaf9714cf907a
        x-checker-data:
          type: json
          url: https://api.github.com/repos/sharkdp/fd/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("aarch64-unknown-linux-musl\\.tar\\.gz$"))
            | .browser_download_url
