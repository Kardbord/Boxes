name: Check Flatpak Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-neovim-base:
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.check.outputs.needs-build }}
      new-commit: ${{ steps.check.outputs.new-commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Check Neovim base commit
        id: check
        run: |
          LATEST=$(flatpak remote-info flathub io.neovim.nvim --show-commit 2>/dev/null | tr -d '[:space:]')
          KNOWN="${{ vars.FLATPAK_NEOVIM_UPSTREAM_COMMIT }}"

          echo "latest=$LATEST"
          echo "known=$KNOWN"

          if [ -z "$LATEST" ]; then
            echo "Warning: could not determine latest Neovim commit"
            echo "needs-build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$LATEST" != "$KNOWN" ]; then
            echo "needs-build=true" >> "$GITHUB_OUTPUT"
            echo "new-commit=$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "needs-build=false" >> "$GITHUB_OUTPUT"
          fi

  update-neovim-tracking:
    needs: check-neovim-base
    if: needs.check-neovim-base.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Update tracked commit
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.updateVariable({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'FLATPAK_NEOVIM_UPSTREAM_COMMIT',
                value: '${{ needs.check-neovim-base.outputs.new-commit }}'
              });
            } catch (e) {
              // Variable may not exist yet; create it
              await github.rest.actions.createVariable({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'FLATPAK_NEOVIM_UPSTREAM_COMMIT',
                value: '${{ needs.check-neovim-base.outputs.new-commit }}'
              });
            }

  trigger-neovim-build:
    needs: check-neovim-base
    if: needs.check-neovim-base.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger flatpak build workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'flatpak-build.yml',
              ref: 'main'
            });

  check-extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for extension source updates
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --update --never-fork
            --commit-msg="chore(flatpak): update extension sources"
            flatpak/manifests/io.github.kardbord.tool.ripgrep/io.github.kardbord.tool.ripgrep.yml
            flatpak/manifests/io.github.kardbord.tool.fd/io.github.kardbord.tool.fd.yml
