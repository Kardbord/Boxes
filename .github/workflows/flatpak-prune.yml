# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Prune stale Flatpak OCI images

on:
  schedule:
    - cron: '0 4 * * 0' # Weekly, Sunday 4am UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (list only, no deletion)'
        type: boolean
        default: true
  workflow_run:
    workflows: ['Build and publish Flatpak repository']
    types: [completed]
    branches: [main]

permissions:
  packages: write

jobs:
  prune:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: aetherpak/actions/.github/workflows/prune-github-container-registry.yml@v3
    with:
      oci-repository: boxes
      dry-run: ${{ inputs.dry-run || false }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
