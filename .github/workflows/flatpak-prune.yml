# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Prune stale Flatpak OCI images

on:
  schedule:
    - cron: '0 4 * * 0' # Weekly, Sunday 4am UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (list only, no deletion)'
        type: boolean
        default: true
  # Note: a workflow_run trigger after "Build and publish Flatpak repository"
  # would be ideal so that stale images are cleaned up promptly. However,
  # GitHub Pages deployments are asynchronous — the build workflow completes
  # once the deployment is queued, not when the new index is live. The prune
  # job fetches the active index from Pages to determine which OCI digests to
  # keep, so if it runs before the new index is served, it can delete the
  # freshly-published images, causing 404s for clients. Until there is a way
  # to await Pages propagation, prune can only be triggered on a schedule or
  # manually.

permissions:
  packages: write

# Serialize with flatpak-build.yml and redeploy-pages.yml so a prune can never
# race an in-flight build's OCI pushes / Pages deploys (stale-index deletion).
concurrency:
  group: flatpak-repo
  cancel-in-progress: false

jobs:
  prune:
    uses: aetherpak/actions/.github/workflows/prune-github-container-registry.yml@v3
    with:
      oci-repository: boxes
      dry-run: ${{ inputs.dry-run || false }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
