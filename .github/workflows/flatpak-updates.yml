# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Check Flatpak upstream updates

on:
  schedule:
    - cron: '0 5 * * 1'   # Weekly, Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Run FEDC on manifests with x-checker-data
        id: fedc
        run: |
          set -uo pipefail
          > /tmp/fedc-errors.txt
          for manifest in $(grep -rl 'x-checker-data' flatpak/manifests/); do
            echo "Checking $manifest..."
            if ! docker run --rm \
              -v "$PWD:/workspace" \
              -v "$PWD/.git:/workspace/.git" \
              -w /workspace \
              ghcr.io/flathub/flatpak-external-data-checker:latest \
              --edit-only --never-fork "$manifest"; then
              echo "- ❌ $manifest" >> /tmp/fedc-errors.txt
            fi
          done
          if [ -s /tmp/fedc-errors.txt ]; then
            {
              echo "## FEDC Errors"
              echo ""
              cat /tmp/fedc-errors.txt
            } >> "$GITHUB_STEP_SUMMARY"
            echo "errors<<EOF" >> "$GITHUB_OUTPUT"
            cat /tmp/fedc-errors.txt >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Update flatpak sources via FEDC'
          title: 'Update flatpak upstream sources'
          body: |
            Automated updates from FEDC checks.
            ${{ steps.fedc.outputs.errors }}
          branch: flatpak-updates
          delete-branch: true
