name: Build and publish Flatpak repository

on:
  push:
    branches: [main]
    paths: [flatpak/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: flatpak
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Phase 1: Build SDK (produces Platform + SDK runtimes)
  # ────────────────────────────────────────────────────────────
  # TODO: Revert to reusable workflow once these upstream issues are resolved:
  #   1. aetherpak/cli: IsRefRelated doesn't account for id-platform relationships
  #      — Platform OCI image is skipped when pushing SDK refs
  #   2. aetherpak/cli: build CLI doesn't extract id from manifest when --manifest
  #      is passed without --app-id
  #   3. aetherpak/actions: build action requires manifest-path even when
  #      AETHERPAK_CONFIG provides it
  # See: https://github.com/aetherpak/cli/issues (file these)
  build-sdk:
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/aetherpak/cli:v0.32.0-builder
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: aetherpak/actions/build@v3
        env:
          AETHERPAK_CONFIG: flatpak/aetherpak-sdk.yaml
        with:
          manifest-path: flatpak/manifests/io.github.kardbord.Sdk/io.github.kardbord.Sdk.yml
          app-id: io.github.kardbord.Sdk
          arch: ${{ matrix.arch }}
          branch: stable
          run-linter: false

      - uses: actions/upload-artifact@v7
        with:
          name: repo-sdk-${{ matrix.arch }}
          path: _repo
          retention-days: 1

  publish-sdk:
    needs: build-sdk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: repo-sdk-${{ matrix.arch }}
          path: _repo

      - uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: io.github.kardbord.Sdk
          arch: ${{ matrix.arch }}
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          records-dir: _records-sdk

      - uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-io.github.kardbord.Sdk-${{ matrix.arch }}
          path: _records-sdk
          include-hidden-files: true
          retention-days: 1

      - uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: io.github.kardbord.Platform
          arch: ${{ matrix.arch }}
          branch: stable
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          records-dir: _records-platform

      - uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-io.github.kardbord.Platform-${{ matrix.arch }}
          path: _records-platform
          include-hidden-files: true
          retention-days: 1

  deploy-sdk:
    needs: publish-sdk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: aetherpak-record-io.github.kardbord.*
          path: _records_in

      - name: Flatten records
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _records
          for dir in _records_in/*/; do cp -r "$dir." _records/; done

      - uses: aetherpak/actions/publish-site@v3
        id: deploy
        env:
          AETHERPAK_CONFIG: flatpak/aetherpak-sdk.yaml
        with:
          records-dir: _records
          pages-url: https://kardbord.github.io/Boxes
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

  # ────────────────────────────────────────────────────────────
  # Phase 2: Build, publish, and deploy apps + extensions
  # ────────────────────────────────────────────────────────────
  plan-apps:
    needs: deploy-sdk
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.wrap.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh

      - name: Compute build matrix
        id: plan
        uses: aetherpak/actions/plan@v3
        with:
          config: aetherpak-apps.yaml
          force: all

      - name: Wrap matrix for strategy
        id: wrap
        if: steps.plan.outputs.matrix != ''
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          echo "matrix=$(printf '%s' "$MATRIX" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  build-apps:
    needs: plan-apps
    if: needs.plan-apps.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-apps.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/aetherpak/cli:v0.32.0-builder
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh

      - name: Build
        uses: aetherpak/actions/build@v3
        env:
          AETHERPAK_CONFIG: aetherpak-apps.yaml
        with:
          manifest-path: ${{ matrix.manifest }}
          app-id: ${{ matrix.app-id }}
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.branch }}
          run-linter: ${{ matrix.run-linter }}

      - name: Upload OSTree repo
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo
          retention-days: 1

  publish-oci:
    needs: [plan-apps, build-apps]
    if: needs.plan-apps.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-apps.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download OSTree repo
        uses: actions/download-artifact@v8
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo

      - name: Push OCI image
        uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: ${{ matrix.app-id }}
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.branch }}
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

      - name: Upload record
        uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _records
          include-hidden-files: true
          retention-days: 1

  deploy-apps:
    needs: [plan-apps, publish-oci]
    if: needs.plan-apps.outputs.matrix != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh

      - name: Download all records
        uses: actions/download-artifact@v8
        with:
          pattern: aetherpak-record-*
          path: _records_in

      - name: Flatten records
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _records
          for dir in _records_in/*/; do cp -r "$dir." _records/; done

      - name: Build and deploy site
        id: deploy
        uses: aetherpak/actions/publish-site@v3
        env:
          AETHERPAK_CONFIG: aetherpak-apps.yaml
        with:
          records-dir: _records
          pages-url: https://kardbord.github.io/Boxes
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
