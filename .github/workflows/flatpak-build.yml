name: Build and deploy Flatpak repository

on:
  push:
    branches: [main]
    paths: [flatpak/**, README.md, landing-page.html]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-sdk:
    name: Build SDK (${{ matrix.variant.arch }})
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/manifests/io.github.kardbord.Sdk/io.github.kardbord.Sdk.yml
          arch: ${{ matrix.variant.arch }}
          build-bundle: false
          upload-artifact: false
          cache-key: flatpak-builder-sdk-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-repo-${{ matrix.variant.arch }}
          path: repo
          retention-days: 1

  build-packages:
    name: Build packages (${{ matrix.variant.arch }})
    needs: build-sdk
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sdk-repo-${{ matrix.variant.arch }}
          path: repo

      - name: Register SDK repo
        run: |
          flatpak remote-add --if-not-exists --no-gpg-verify local-repo "$(pwd)/repo"
          flatpak install -y --noninteractive local-repo io.github.kardbord.Sdk
          flatpak install -y --noninteractive local-repo io.github.kardbord.Platform

      - name: Discover manifests
        id: discover
        run: |
          extensions=""
          apps=""

          for dir in flatpak/manifests/*/; do
            name=$(basename "${dir}")
            case "${name}" in
              io.github.kardbord.Sdk) continue ;;
              io.github.kardbord.tool.*) extensions="${extensions} ${name}" ;;
              io.github.kardbord.*) apps="${apps} ${name}" ;;
            esac
          done

          echo "extensions=${extensions# }" >> "$GITHUB_OUTPUT"
          echo "apps=${apps# }" >> "$GITHUB_OUTPUT"

      - name: Build extensions
        run: |
          for pkg in ${{ steps.discover.outputs.extensions }}; do
            echo "::group::Building ${pkg}"
            flatpak-builder --force-clean --install-deps-from=flathub \
              --repo=repo "build-${pkg}" \
              "flatpak/manifests/${pkg}/${pkg}.yml"
            echo "::endgroup::"
          done

      - name: Build apps
        run: |
          for pkg in ${{ steps.discover.outputs.apps }}; do
            echo "::group::Building ${pkg}"
            flatpak-builder --force-clean --install-deps-from=flathub \
              --repo=repo "build-${pkg}" \
              "flatpak/manifests/${pkg}/${pkg}.yml"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: packages-repo-${{ matrix.variant.arch }}
          path: repo
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree pandoc

      - uses: actions/download-artifact@v8
        with:
          name: packages-repo-x86_64
          path: packages-repo-x86_64

      - uses: actions/download-artifact@v8
        with:
          name: packages-repo-aarch64
          path: packages-repo-aarch64

      - name: Merge architecture repos
        run: |
          ostree pull-local --repo=packages-repo-x86_64/repo packages-repo-aarch64/repo
          mv packages-repo-x86_64/repo repo

      - name: Import GPG key
        id: gpg
        run: |
          if [ -n "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
            KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk -F'/' '/sec/{print $2}' | awk '{print $1}' | head -1)
            echo "gpg_key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"
            echo "gpg_signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GPG key imported. Repo will be signed."
          else
            echo "gpg_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLATPAK_GPG_PRIVATE_KEY not set. Repo will not be signed. Users will need --no-gpg-verify."
          fi

      - name: Sign repository
        if: steps.gpg.outputs.gpg_signed == 'true'
        run: |
          for ref in $(flatpak --repo=repo refs); do
            flatpak build-sign --gpg-sign=${{ steps.gpg.outputs.gpg_key_id }} repo "$ref"
          done

      - name: Generate landing page
        run: scripts/generate-landing-page.sh staging/index.html

      - name: Stage for deployment
        run: |
          touch staging/.nojekyll
          mv repo staging/repo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: staging

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
