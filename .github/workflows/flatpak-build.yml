# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Build and publish Flatpak repository

on:
  push:
    branches: [main]
    paths:
      - flatpak/**
      - scripts/generate-aetherpak-config.sh
      - .github/workflows/flatpak-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: flatpak-repo
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # Phase 0: Plan SDK changes (detect if SDK manifest changed)
  # ────────────────────────────────────────────────────────────
  plan-sdk:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.wrap.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan SDK
        uses: aetherpak/actions/plan@v3
        with:
          config: flatpak/aetherpak-sdk.yaml
          force: ${{ github.event_name == 'workflow_dispatch' && 'all' || '' }}
          base-sha: ${{ github.event_name == 'push' && github.event.before || '' }}
          workflow-path: .github/workflows/flatpak-build.yml

      - name: Wrap matrix for strategy
        id: wrap
        if: steps.plan.outputs.matrix != ''
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          echo "matrix=$(printf '%s' "$MATRIX" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────
  # Phase 1: Build SDK (produces Platform + SDK runtimes)
  # ────────────────────────────────────────────────────────────
  # Phase 1 cannot use the reusable workflow (aetherpak/actions/.github/workflows/publish.yml@v3)
  # because the Platform runtime is a side-effect of the SDK build — both refs live in the
  # same OSTree repo. The reusable workflow builds each app independently, so Platform would
  # have no repo to push from. Composite actions let us push both SDK and Platform OCI images
  # from the SDK's repo.
  build-sdk:
    needs: plan-sdk
    if: needs.plan-sdk.outputs.matrix != ''
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/aetherpak/cli:v0.32.0-builder
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: aetherpak/actions/build@v3
        env:
          AETHERPAK_CONFIG: flatpak/aetherpak-sdk.yaml
        with:
          manifest-path: flatpak/manifests/io.github.kardbord.Sdk/io.github.kardbord.Sdk.yml
          app-id: io.github.kardbord.Sdk
          arch: ${{ matrix.arch }}
          branch: stable
          run-linter: false

      - uses: actions/upload-artifact@v7
        with:
          name: repo-sdk-${{ matrix.arch }}
          path: _repo
          retention-days: 1

  publish-sdk:
    needs: build-sdk
    if: needs.build-sdk.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/download-artifact@v8
        with:
          name: repo-sdk-${{ matrix.arch }}
          path: _repo

      - uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: io.github.kardbord.Sdk
          arch: ${{ matrix.arch }}
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          records-dir: _records-sdk

      - uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-io.github.kardbord.Sdk-${{ matrix.arch }}
          path: _records-sdk
          include-hidden-files: true
          retention-days: 1

      - uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: io.github.kardbord.Platform
          arch: ${{ matrix.arch }}
          branch: stable
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          records-dir: _records-platform

      - uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-io.github.kardbord.Platform-${{ matrix.arch }}
          path: _records-platform
          include-hidden-files: true
          retention-days: 1

  deploy-sdk:
    needs: publish-sdk
    if: needs.publish-sdk.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/download-artifact@v8
        with:
          pattern: aetherpak-record-io.github.kardbord.*
          path: _records_in

      - name: Flatten records
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _records
          for dir in _records_in/*/; do cp -r "$dir." _records/; done

      - uses: aetherpak/actions/publish-site@v3
        id: deploy
        env:
          AETHERPAK_CONFIG: flatpak/aetherpak-sdk.yaml
        with:
          pages-artifact-name: github-pages-sdk
          records-dir: _records
          pages-url: https://kardbord.github.io/Boxes
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          index-template: .github/workflows/templates/index.html

      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-sdk

  # ────────────────────────────────────────────────────────────
  # Phase 2: Build, publish, and deploy apps + extensions
  # ────────────────────────────────────────────────────────────
  plan-apps:
    needs: deploy-sdk
    if: needs.plan-sdk.result == 'success' && (needs.deploy-sdk.result == 'success' || needs.plan-sdk.outputs.matrix == '')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.wrap.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh

      - name: Compute build matrix
        id: plan
        uses: aetherpak/actions/plan@v3
        with:
          config: aetherpak-apps.yaml
          force: ${{ github.event_name == 'workflow_dispatch' && 'all' || '' }}
          base-sha: ${{ github.event_name == 'push' && github.event.before || '' }}
          workflow-path: .github/workflows/flatpak-build.yml

      - name: Wrap matrix for strategy
        id: wrap
        if: steps.plan.outputs.matrix != ''
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          echo "matrix=$(printf '%s' "$MATRIX" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  build-apps:
    needs: plan-apps
    if: needs.plan-apps.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-apps.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/aetherpak/cli:v0.32.0-builder
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh

      - name: Build
        id: build
        uses: aetherpak/actions/build@v3
        env:
          AETHERPAK_CONFIG: aetherpak-apps.yaml
        with:
          manifest-path: ${{ matrix.manifest }}
          app-id: ${{ matrix.app-id }}
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.branch }}
          run-linter: ${{ matrix.run-linter }}

      - name: Upload OSTree repo
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo
          retention-days: 1

      - name: Record build result
        if: always()
        run: |
          mkdir -p _build-results
          echo "${{ matrix.app-id }} ${{ matrix.arch }} ${{ steps.build.outcome }}" > _build-results/${{ matrix.app-id }}-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-apps-results-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _build-results/

  build-apps-gate:
    needs: [plan-apps, build-apps]
    if: always() && needs.plan-apps.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download build results
        uses: actions/download-artifact@v8
        with:
          pattern: build-apps-results-*
          path: _build_results
          merge-multiple: true

      - name: Count successes and report failures
        if: always()
        run: |
          set -euo pipefail
          echo "## Build cell results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          TOTAL=0
          FAILED=0
          for f in _build_results/*.txt; do
            [ -f "$f" ] || continue
            TOTAL=$((TOTAL + 1))
            read -r app arch status < "$f"
            if [[ "$status" != "success" ]]; then
              echo "- ❌ $app ($arch): $status" >> "$GITHUB_STEP_SUMMARY"
              FAILED=$((FAILED + 1))
            fi
          done
          if [[ "$TOTAL" -eq 0 ]]; then
            echo "No build cells ran" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$FAILED" -eq 0 ]]; then
            echo "All $TOTAL cell(s) succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$FAILED of $TOTAL cell(s) failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-oci:
    needs: [plan-apps, build-apps-gate]
    if: needs.plan-apps.outputs.matrix != '' && needs.build-apps-gate.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-apps.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Download OSTree repo
        continue-on-error: true
        id: download
        uses: actions/download-artifact@v8
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo

      - name: Push OCI image
        if: steps.download.outcome == 'success'
        uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: ${{ matrix.app-id }}
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.branch }}
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

      - name: Upload record
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _records
          include-hidden-files: true
          retention-days: 1

  deploy-apps:
    needs: [plan-apps, build-apps-gate, publish-oci]
    if: needs.plan-apps.outputs.matrix != '' && needs.build-apps-gate.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh
        env:
          INCLUDE_SDK: "true"

      - name: Download all records
        uses: actions/download-artifact@v8
        with:
          pattern: aetherpak-record-*
          path: _records_in

      - name: Flatten records
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _records
          for dir in _records_in/*/; do cp -r "$dir." _records/; done

      - name: Build and deploy site
        id: deploy
        uses: aetherpak/actions/publish-site@v3
        env:
          AETHERPAK_CONFIG: aetherpak-apps.yaml
        with:
          pages-artifact-name: github-pages-apps
          records-dir: _records
          pages-url: https://kardbord.github.io/Boxes
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          index-template: .github/workflows/templates/index.html

      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-apps
