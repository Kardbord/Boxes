# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Build and publish Flatpak repository

on:
  push:
    branches: [main]
    paths: [flatpak/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Phase 1: Build SDK (produces Platform + SDK runtimes)
  # ────────────────────────────────────────────────────────────
  # Phase 1 cannot use the reusable workflow (aetherpak/actions/.github/workflows/publish.yml@v3)
  # because the Platform runtime is a side-effect of the SDK build — both refs live in the
  # same OSTree repo. The reusable workflow builds each app independently, so Platform would
  # have no repo to push from. Composite actions let us push both SDK and Platform OCI images
  # from the SDK's repo.
  build-sdk:
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/aetherpak/cli:v0.32.0-builder
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: aetherpak/actions/build@v3
        env:
          AETHERPAK_CONFIG: flatpak/aetherpak-sdk.yaml
        with:
          manifest-path: flatpak/manifests/io.github.kardbord.Sdk/io.github.kardbord.Sdk.yml
          app-id: io.github.kardbord.Sdk
          arch: ${{ matrix.arch }}
          branch: stable
          run-linter: false

      - uses: actions/upload-artifact@v7
        with:
          name: repo-sdk-${{ matrix.arch }}
          path: _repo
          retention-days: 1

  publish-sdk:
    needs: build-sdk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: repo-sdk-${{ matrix.arch }}
          path: _repo

      - uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: io.github.kardbord.Sdk
          arch: ${{ matrix.arch }}
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          records-dir: _records-sdk

      - uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-io.github.kardbord.Sdk-${{ matrix.arch }}
          path: _records-sdk
          include-hidden-files: true
          retention-days: 1

      - uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: io.github.kardbord.Platform
          arch: ${{ matrix.arch }}
          branch: stable
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          records-dir: _records-platform

      - uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-io.github.kardbord.Platform-${{ matrix.arch }}
          path: _records-platform
          include-hidden-files: true
          retention-days: 1

  deploy-sdk:
    needs: publish-sdk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: aetherpak-record-io.github.kardbord.*
          path: _records_in

      - name: Flatten records
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _records
          for dir in _records_in/*/; do cp -r "$dir." _records/; done

      - uses: aetherpak/actions/publish-site@v3
        id: deploy
        env:
          AETHERPAK_CONFIG: flatpak/aetherpak-sdk.yaml
        with:
          pages-artifact-name: github-pages-sdk
          records-dir: _records
          pages-url: https://kardbord.github.io/Boxes
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          index-template: .github/workflows/templates/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: aetherpak-records
          path: _records
          overwrite: true
          retention-days: 90

      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-sdk

  # ────────────────────────────────────────────────────────────
  # Phase 2: Build, publish, and deploy apps + extensions
  # ────────────────────────────────────────────────────────────
  plan-apps:
    needs: deploy-sdk
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.wrap.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh

      - name: Compute build matrix
        id: plan
        uses: aetherpak/actions/plan@v3
        with:
          config: aetherpak-apps.yaml
          force: all

      - name: Wrap matrix for strategy
        id: wrap
        if: steps.plan.outputs.matrix != ''
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          echo "matrix=$(printf '%s' "$MATRIX" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  build-apps:
    needs: plan-apps
    if: needs.plan-apps.outputs.matrix != ''
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-apps.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/aetherpak/cli:v0.32.0-builder
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh

      - name: Build
        uses: aetherpak/actions/build@v3
        env:
          AETHERPAK_CONFIG: aetherpak-apps.yaml
        with:
          manifest-path: ${{ matrix.manifest }}
          app-id: ${{ matrix.app-id }}
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.branch }}
          run-linter: ${{ matrix.run-linter }}

      - name: Upload OSTree repo
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo
          retention-days: 1

  build-apps-gate:
    needs: [plan-apps, build-apps]
    if: always() && needs.plan-apps.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check if any build succeeded
        env:
          BUILD_RESULT: ${{ needs.build-apps.result }}
        run: |
          if [[ "$BUILD_RESULT" == "success" ]]; then
            echo "At least one build succeeded"
          else
            echo "All builds failed"
            exit 1
          fi

  publish-oci:
    needs: [plan-apps, build-apps-gate]
    if: needs.plan-apps.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-apps.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download OSTree repo
        continue-on-error: true
        id: download
        uses: actions/download-artifact@v8
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo

      - name: Push OCI image
        if: steps.download.outcome == 'success'
        uses: aetherpak/actions/publish-oci@v3
        with:
          repo-path: _repo
          app-id: ${{ matrix.app-id }}
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.branch }}
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

      - name: Upload record
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _records
          include-hidden-files: true
          retention-days: 1

  deploy-apps:
    needs: [plan-apps, publish-oci]
    if: needs.plan-apps.outputs.matrix != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh
        env:
          INCLUDE_SDK: "true"

      - name: Download all records
        uses: actions/download-artifact@v8
        with:
          pattern: aetherpak-record-*
          path: _records_in

      - name: Flatten records
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _records
          for dir in _records_in/*/; do cp -r "$dir." _records/; done

      - name: Build and deploy site
        id: deploy
        uses: aetherpak/actions/publish-site@v3
        env:
          AETHERPAK_CONFIG: aetherpak-apps.yaml
        with:
          pages-artifact-name: github-pages-apps
          records-dir: _records
          pages-url: https://kardbord.github.io/Boxes
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          index-template: .github/workflows/templates/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: aetherpak-records
          path: _records
          overwrite: true
          retention-days: 90

      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-apps

  cleanup-caches:
    needs: deploy-apps
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Prune old Actions caches
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          MAX_BYTES=$((10 * 1024 * 1024 * 1024))

          echo "Fetching GitHub Actions caches for ${REPO}..."
          ALL_CACHES=$(gh api --paginate "repos/${REPO}/actions/caches?per_page=100" | jq -s '[.[].actions_caches[]]')

          TOTAL_BYTES=$(echo "$ALL_CACHES" | jq '[.[].size_in_bytes] | add // 0')
          echo "Total cache size: $((TOTAL_BYTES / 1024 / 1024)) MB / $((MAX_BYTES / 1024 / 1024 / 1024)) GB"

          if [ "$TOTAL_BYTES" -lt "$MAX_BYTES" ]; then
            echo "Cache size is under the 10 GB budget. No pruning needed."
            exit 0
          fi

          echo "Cache size exceeds 10 GB budget. Pruning oldest caches..."
          SORTED=$(echo "$ALL_CACHES" | jq -r 'sort_by(.last_accessed_at) | .[] | "\(.id)\t\(.size_in_bytes)"')

          DELETED_BYTES=0
          DELETED_COUNT=0

          while IFS=$'\t' read -r id size; do
            CURRENT_TOTAL=$((TOTAL_BYTES - DELETED_BYTES))
            if [ "$CURRENT_TOTAL" -lt "$MAX_BYTES" ]; then
              break
            fi
            echo "Deleting cache ${id} ($((size / 1024 / 1024)) MB)..."
            if gh api --method DELETE "repos/${REPO}/actions/caches/${id}" >/dev/null 2>&1; then
              DELETED_BYTES=$((DELETED_BYTES + size))
              DELETED_COUNT=$((DELETED_COUNT + 1))
            else
              echo "Warning: failed to delete cache ${id}, skipping."
            fi
          done <<< "$SORTED"

          echo "Pruned ${DELETED_COUNT} cache(s), reclaimed $((DELETED_BYTES / 1024 / 1024)) MB."
