# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Build and publish Flatpak repository

on:
  push:
    branches: [main]
    paths:
      - flatpak/**
      - scripts/generate-aetherpak-config.sh
      - .github/workflows/flatpak-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: flatpak-repo
  cancel-in-progress: false

jobs:
  verify-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify aetherpak-apps.yaml is in sync with manifests
        run: |
          set -euo pipefail
          cp flatpak/aetherpak-apps.yaml /tmp/aetherpak-apps.committed.yaml
          scripts/generate-aetherpak-config.sh
          if ! diff -u /tmp/aetherpak-apps.committed.yaml flatpak/aetherpak-apps.yaml; then
            echo "::error::flatpak/aetherpak-apps.yaml is out of sync with flatpak/manifests/."
            echo "::error::Run scripts/generate-aetherpak-config.sh and commit the result."
            exit 1
          fi

  publish-apps:
    needs: verify-config
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      config: flatpak/aetherpak-apps.yaml
      concurrency-group: flatpak-repo
      index-template: .github/workflows/templates/index.html
      workflow-path: .github/workflows/flatpak-build.yml
      force-all: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
