# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Build and publish Flatpak repository

on:
  push:
    branches: [main]
    paths:
      - flatpak/**
      - scripts/generate-aetherpak-config.sh
      - .github/workflows/flatpak-build.yml
  pull_request:
    branches: [main]
    paths:
      - flatpak/**
      - scripts/generate-aetherpak-config.sh
      - .github/workflows/flatpak-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('flatpak-pr-{0}', github.head_ref) || 'flatpak-repo' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify aetherpak-apps.yaml is in sync with manifests
        run: |
          set -euo pipefail
          cp flatpak/aetherpak-apps.yaml /tmp/aetherpak-apps.committed.yaml
          scripts/generate-aetherpak-config.sh
          if ! diff -u /tmp/aetherpak-apps.committed.yaml flatpak/aetherpak-apps.yaml; then
            echo "::error::flatpak/aetherpak-apps.yaml is out of sync with flatpak/manifests/."
            echo "::error::Run scripts/generate-aetherpak-config.sh and commit the result."
            exit 1
          fi

  publish-hub:
    needs: verify-config
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      config: flatpak/aetherpak-apps.yaml
      app: io.github.kardbord.dev
      concurrency-group: flatpak-repo-deploy
      index-template: .github/workflows/templates/index.html
      deploy: false
      artifact-name: aetherpak-site-hub
      dry-run: ${{ github.event_name == 'pull_request' }}
    secrets:
      gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

  deploy-hub-site:
    needs: publish-hub
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: flatpak-repo-deploy
      cancel-in-progress: false
    steps:
      - name: Download hub site artifact
        uses: actions/download-artifact@v8
        with:
          name: aetherpak-site-hub
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-hub
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-hub

  publish-apps:
    needs: [verify-config, deploy-hub-site]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      config: flatpak/aetherpak-apps.yaml
      concurrency-group: flatpak-repo-deploy
      index-template: .github/workflows/templates/index.html
      workflow-path: .github/workflows/flatpak-build.yml
      force-all: ${{ github.event_name == 'workflow_dispatch' }}
      deploy: false
      artifact-name: aetherpak-site-all
      dry-run: ${{ github.event_name == 'pull_request' }}
    secrets:
      gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

  deploy-full-site:
    needs: publish-apps
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: flatpak-repo-deploy
      cancel-in-progress: false
    steps:
      - name: Download hub site artifact
        uses: actions/download-artifact@v8
        with:
          name: aetherpak-site-all
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
