name: Build and deploy Flatpak repository

on:
  push:
    branches: [main]
    paths: [flatpak/**, README.md, landing-page.html]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build SDK
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/manifests/io.github.kardbord.Sdk/io.github.kardbord.Sdk.yml
          repo-dir: repo
          cache-key: sdk-${{ github.sha }}

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdk-repo
          path: repo
          retention-days: 1

  build-and-deploy:
    needs: build-sdk
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install pandoc
        run: dnf install -y pandoc

      - name: Download SDK artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-repo
          path: repo

      - name: Register local repo
        run: |
          flatpak --system remote-add --if-not-exists --no-gpg-verify local-repo repo
          flatpak --system install -y local-repo io.github.kardbord.Sdk
          flatpak --system install -y local-repo io.github.kardbord.Platform

      - name: Cache flatpak-builder state
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/manifests/**/*.yml') }}
          restore-keys: flatpak-builder-

      - name: Import GPG key
        id: gpg
        run: |
          if [ -n "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
            KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk -F'/' '/sec/{print $2}' | awk '{print $1}' | head -1)
            echo "gpg_key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"
            echo "gpg_signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GPG key imported. Repo will be signed."
          else
            echo "gpg_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLATPAK_GPG_PRIVATE_KEY not set. Repo will not be signed. Users will need --no-gpg-verify."
          fi

      - name: Discover manifests
        id: discover
        run: |
          sdk=""
          extensions=""
          apps=""

          for dir in flatpak/manifests/*/; do
            name=$(basename "${dir}")
            case "${name}" in
              io.github.kardbord.Sdk)
                sdk="${name}"
                ;;
              io.github.kardbord.tool.*)
                extensions="${extensions} ${name}"
                ;;
              io.github.kardbord.*)
                apps="${apps} ${name}"
                ;;
            esac
          done

          echo "sdk=${sdk}" >> "$GITHUB_OUTPUT"
          echo "extensions=${extensions# }" >> "$GITHUB_OUTPUT"
          echo "apps=${apps# }" >> "$GITHUB_OUTPUT"

      - name: Build extensions
        run: |
          for pkg in ${{ steps.discover.outputs.extensions }}; do
            echo "::group::Building ${pkg}"
            flatpak-builder --force-clean --install-deps-from=flathub \
              --repo=repo "build-${pkg}" \
              "flatpak/manifests/${pkg}/${pkg}.yml"
            echo "::endgroup::"
          done

      - name: Build apps
        run: |
          for pkg in ${{ steps.discover.outputs.apps }}; do
            echo "::group::Building ${pkg}"
            flatpak-builder --force-clean --install-deps-from=flathub \
              --repo=repo "build-${pkg}" \
              "flatpak/manifests/${pkg}/${pkg}.yml"
            echo "::endgroup::"
          done

      - name: Sign repository
        if: steps.gpg.outputs.gpg_signed == 'true'
        run: |
          for ref in $(flatpak --repo=repo refs); do
            flatpak build-sign --gpg-sign=${{ steps.gpg.outputs.gpg_key_id }} repo "$ref"
          done

      - name: Generate landing page
        run: scripts/generate-landing-page.sh staging/index.html

      - name: Stage for deployment
        run: |
          touch staging/.nojekyll
          mv repo staging/repo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: staging

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
