# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Redeploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/templates/index.html

permissions:
  contents: read

# Serialize with flatpak-build.yml and flatpak-prune.yml so a redeploy can
# never race an in-flight build's OCI pushes / Pages deploys.
concurrency:
  group: flatpak-repo
  cancel-in-progress: false

jobs:
  redeploy:
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      config: flatpak/aetherpak-apps.yaml
      reconcile-only: true
      concurrency-group: flatpak-repo-deploy
      index-template: .github/workflows/templates/index.html
    secrets:
      gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
