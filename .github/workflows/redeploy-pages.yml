# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Redeploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/templates/index.html

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7

      - name: Find latest flatpak-build run
        id: find-flatpak-run
        run: |
          RUN_ID=$(gh api repos/Kardbord/Boxes/actions/workflows/flatpak-build.yml/runs \
            -q '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | .id' \
            | head -1)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download records
        uses: actions/download-artifact@v8
        with:
          name: aetherpak-records
          path: _records
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Kardbord/Boxes
          run-id: ${{ steps.find-flatpak-run.outputs.run_id }}

      - name: Generate aetherpak-apps.yaml
        run: scripts/generate-aetherpak-config.sh
        env:
          INCLUDE_SDK: "true"

      - name: Deploy site
        uses: aetherpak/actions/publish-site@v3
        env:
          AETHERPAK_CONFIG: aetherpak-apps.yaml
        with:
          pages-artifact-name: github-pages-redeploy
          records-dir: _records
          pages-url: https://kardbord.github.io/Boxes
          signing: auto
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          index-template: .github/workflows/templates/index.html

      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-redeploy
